workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      groups:
        - appstore_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.retetoscanaclassica.myapp
        provisioning_profiles:
          - RTC App Store Profile # Metti il nome esatto che hai dato su Codemagic
        certificates:
          - rtc_distribution # Metti il nome esatto del certificato che hai su Codemagic
    scripts:
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa