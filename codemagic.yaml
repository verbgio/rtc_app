workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
workflows:
  ios-workflow:
    name: iOS Workflow
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Rete Toscana Classica
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: it.retetoscanaclassica.myapp
    scripts:
      - name: Build IPA
        script: |
          flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa