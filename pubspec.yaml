name: rtc_app
description: "App della radio RTC"
publish_to: 'none'
version: 1.0.3+7

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  audio_session: ^0.1.25
  path_provider: ^2.1.0
  http: ^1.1.0
  webfeed: ^0.7.0
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/launcher.png"